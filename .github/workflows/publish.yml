name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 2026-11-05 14:15 +03: __version__ is sent in the User-Agent, so it and pyproject.toml must equal the tag (#939).
      - name: Check version matches the tag
        run: |
          v=$(grep -oE '^__version__ = "[^"]+"' src/kwtsms/__init__.py | cut -d'"' -f2)
          p=$(grep -oE '^version = "[^"]+"' pyproject.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] && [ "v$p" = "${GITHUB_REF_NAME}" ] || { echo "::error::__version__ ($v) or pyproject version ($p) does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Install uv
        run: pip install uv

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
