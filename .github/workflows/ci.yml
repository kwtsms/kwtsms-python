name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    # 2026-11-15 10:07 +03: ubuntu-latest (26.04) has no Python 3.8 any more; 3.8 runs on 22.04. 3.14 and 3.15 added (weekly upstream check).
    runs-on: ${{ matrix.python-version == '3.8' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # 2026-11-05 07:08 +03: test number from the repo secret; tests that need it skip when unset (int-testnumber).
      - name: Run tests
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: uv run pytest tests/ -v --ignore=tests/test_integration.py
